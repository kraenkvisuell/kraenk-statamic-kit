<div class="italic uppercase tracking-wider text-off text-[0.9rem] md:text-[1rem]">
    {{ locales current_first="false" }}
        {{ if current != locale.key }}
            <a href="{{ url }}" class="hover:text-ink">{{ locale.short }}</a>
        {{ else }}
            <span class="text-ink">{{ locale.short }}</span>
        {{ /if }}
        {{ if !last }}
            &nbsp;&nbsp;/&nbsp;&nbsp;
        {{ /if }}
    {{ /locales }}
</div>
