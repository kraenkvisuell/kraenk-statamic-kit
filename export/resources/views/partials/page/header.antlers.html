{{ _set_label = {partial:sets/label :set_type="back_set"} }}
{{ _set_url = {partial:sets/url :set_type="back_set"} }}
<header class="px-5 py-6 md:px-10 md:py-8 xl:px-17.5 font-headline font-bold uppercase tracking-wider">
    <a href="{{ if _set_url | trim }}{{ _set_url | trim }}{{ else }}{{ site:url }}#{{ back_to }}{{ /if }}" x-data="backLink" @click="back($event)" class="inline-flex items-center gap-2 mb-4 text-[0.8rem] leading-none">
        <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 7H1.5M6.5 2 1.5 7l5 5"/>
        </svg>
        <span>{{ if _set_label | trim }}{{ _set_label | trim }}{{ else }}{{ back_label }}{{ /if }}</span>
    </a>

    <h1 class="text-[0.8rem] md:text-[1.3rem] tracking-wider leading-none">
        {{ slot }}
    </h1>
</header>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('backLink', () => ({
            fromTarget: false,

            init() {
                try {
                    // came from the page the link points to (same origin and path)
                    const referrer = new URL(document.referrer)
                    const target = new URL(this.$el.href)
                    this.fromTarget = referrer.origin === location.origin
                        && referrer.pathname.replace(/\/$/, '') === target.pathname.replace(/\/$/, '')
                } catch {
                    // no or unparsable referrer: keep the href
                }
            },

            back(event) {
                if (! this.fromTarget) return

                event.preventDefault()
                history.back()
            },
        }))
    })
</script>
