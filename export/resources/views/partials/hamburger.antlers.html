<button
    type="button"
    @click="toggleMenu()"
    :class="menuOpen && 'active'"
    :aria-expanded="menuOpen"
    aria-controls="site-menu"
    aria-label="{{ trans:frontend.menu }}"
    class="fixed top-2.5 right-2.5 md:top-5 md:right-5 xl:right-11.5 z-40 mix-blend-difference"
>
    <div class="
        h-10 md:h-12 w-10 md:w-12 rounded-full bg-white flex flex-col items-center justify-center gap-1.5 
        cursor-pointer 
    ">
        <span
            class="block w-5 h-0.5 bg-current transition-transform duration-300 ease-in-out in-[.active]:translate-y-2 in-[.active]:rotate-45"
        ></span>
        <span
            class="block w-5 h-0.5 bg-current transition-opacity duration-300 ease-in-out in-[.active]:opacity-0"></span>
        <span
            class="block w-5 h-0.5 bg-current transition-transform duration-300 ease-in-out in-[.active]:-translate-y-2 in-[.active]:-rotate-45"
        ></span>
    </div>
</button>
