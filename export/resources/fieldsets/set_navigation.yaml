title: 'Set-Navigation'
fields:
  -
    handle: anchor
    field:
      type: slug
      display: Anker
      instructions: 'Optional – Sprungmarke des Abschnitts, z.B. "galerie" ergibt /seite#galerie. Nur Kleinbuchstaben, Ziffern und Bindestriche.'
      width: 50
      validate:
        - 'regex:/^[a-z0-9-]*$/'
  -
    handle: navigation_title
    field:
      type: text
      display: 'Titel für Verlinkungen'
      instructions: 'Optional – Bezeichnung des Abschnitts in Links dorthin, z.B. im Zurück-Link von Unterseiten. Sonst gilt die Überschrift.'
      width: 50
