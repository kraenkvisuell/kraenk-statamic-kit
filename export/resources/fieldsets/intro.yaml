title: Intro
fields:
  -
    handle: has_intro
    field:
      type: toggle
      display: 'Hat Intro'
      instructions: 'Zeigt Video, Intro-Headline und -Text oberhalb der Sets'
      default: true
      localizable: false
      width: 50
  -
    handle: video
    field:
      type: assets
      container: main
      folder: /
      restrict: false
      max_files: 1
      width: 50
      display: Video
      instructions: 'mp4 – läuft stumm in Endlosschleife, füllt die Intro-Höhe'
      localizable: false
      if:
        has_intro: 'equals true'
  -
    handle: intro_headline
    field:
      type: textarea
      display: 'Intro Headline'
      localizable: true
      if:
        has_intro: 'equals true'
  -
    handle: intro_text
    field:
      type: bard
      buttons:
        - bold
        - underline
        - unorderedlist
        - orderedlist
        - removeformat
        - anchor
      style: sans
      spellcheck: true
      allow_source: true
      allow_internal_links: true
      link_noopener: false
      link_noreferrer: false
      target_blank: true
      semantic_elements: true
      restrict_assets: false
      instructions: |-
        Zeilenumbruch ohne Abstand = Shift + Enter

        Absatztext wird in der Website kursiv dargestellt (hier mit "kursiv" markierter Text wird dann in der Website umgekehrt, also "nicht kursiv" dargestellt).
      display: Introtext
      localizable: true
      if:
        has_intro: 'equals true'
  -
    handle: cta
    field: cta.cta
    config:
      if:
        has_intro: 'equals true'
