title: Projekte
icon: collections
sites:
  - default
  - en
propagate: false
template: project
layout: layout
revisions: false
route: '/projects/{slug}'
sort_dir: asc
date_behavior:
  past: null
  future: null
preview_targets:
  -
    label: Entry
    url: '{permalink}'
    refresh: true
inject:
  seo:
    description: '@seo:description'
    image: '@seo:still'
    og_type: video.other
  columns:
    - title
    - year
structure:
  root: false
  max_depth: 1
