title: Website
sections:
  address:
    display: Kontakt
    fields:
      -
        handle: contact_topline
        field:
          type: textarea
          display: 'Topline Kontakt'
          localizable: true
      -
        handle: phone
        field:
          type: text
          display: Telefon
          width: 50
      -
        handle: email
        field:
          type: text
          display: E-Mail
          width: 50
      -
        handle: second_contact_topline
        field:
          type: textarea
          display: 'Topline Sekundärer Kontakt'
          localizable: true
      -
        handle: second_phone
        field:
          type: text
          display: 'Sekundäres Telefon'
          width: 50
      -
        handle: second_email
        field:
          type: text
          display: 'Sekundäre E-Mail'
          width: 50
      -
        handle: company
        field:
          type: text
          display: Firma
          width: 50
      -
        handle: fax
        field:
          type: text
          display: Fax
          width: 50
      -
        handle: address
        field:
          type: textarea
          display: Adresse
          width: 50
      -
        handle: gmaps_link
        field:
          type: text
          display: 'Google Maps Link'
          width: 50
      -
        handle: contact_image
        field:
          type: assets
          container: main
          folder: /
          restrict: false
          max_files: 1
          width: 50
          display: Kontakt-Bild
      -
        handle: social_links_topline
        field:
          type: text
          display: 'Topline Social Links'
          localizable: true
      -
        handle: social_links
        field:
          type: replicator
          sets:
            social_link:
              display: 'Social Link'
              fields:
                -
                  handle: title
                  field:
                    type: text
                    width: 50
                    display: Titel
                -
                  handle: link
                  field:
                    type: text
                    width: 50
                    display: Link
          display: 'Social Links'
      -
        handle: newsletter_text
        field:
          type: textarea
          display: Newsletter-Text
          localizable: true
          width: 50
      -
        handle: newsletter_link
        field:
          type: text
          display: Newsletter-Link
          width: 50
  videos:
    display: Videos
    fields:
      -
        handle: video_consent_text
        field:
          type: textarea
          display: 'Hinweis vor eingebetteten Videos'
          instructions: 'Wird anstelle eines Vimeo-/YouTube-Videos gezeigt, bis Besucher das Laden von Drittanbieter-Videos akzeptiert haben. Die Entscheidung merkt sich der Browser (localStorage).'
          localizable: true
          default: 'Dieses Video wird von Vimeo bzw. YouTube bereitgestellt. Beim Laden werden Daten an den jeweiligen Anbieter übertragen. Mit einem Klick akzeptieren Sie das Laden von Drittanbieter-Videos – Ihr Browser merkt sich diese Entscheidung.'
      -
        handle: video_consent_button
        field:
          type: text
          display: 'Button: Videos akzeptieren'
          localizable: true
          width: 50
          default: 'Videos aktivieren'
      -
        handle: video_consent_revoke
        field:
          type: text
          display: 'Button: Zustimmung widerrufen (Footer)'
          instructions: 'Erscheint im Footer, sobald Videos akzeptiert wurden.'
          localizable: true
          width: 50
          default: 'Drittanbieter-Videos nicht mehr laden'
      -
        handle: privacy_page
        field:
          type: entries
          display: Datenschutzseite
          instructions: 'Wird im Hinweis vor eingebetteten Videos verlinkt.'
          collections:
            - pages
          max_items: 1
          width: 50
  embed_codes:
    display: 'Embed Codes'
    fields:
      -
        handle: header_scripts
        field:
          type: textarea
          instructions: 'Z.B. für den Google Analytics Tracking-Code'
          display: Header-Scripts
taxonomies: false
