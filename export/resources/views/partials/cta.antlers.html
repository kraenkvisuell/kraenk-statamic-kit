<div class="mb-6">
{{ cta }}
    {{ if link }}
        <a
            href="{{ link }}"
            class="inline-flex items-center min-h-9 md:min-h-9.5 font-headline font-bold uppercase tracking-wider not-italic no-underline text-[0.85rem] md:text-[1.05rem]"
        >{{ title }}</a>
        {{ if subtitle }}
            <br>
            <a href="{{ link }}">{{ subtitle }}</a>
        {{ /if }}
    {{ /if }}
{{ /cta }}
</div>
