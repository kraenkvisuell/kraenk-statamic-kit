title: Blog-Post
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: Titel
              width: 50
              localizable: true
              validate:
                - required
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              width: 50
              display: Datum
              localizable: false
              validate:
                - required
          -
            handle: teaser
            field:
              type: bard
              buttons:
                - bold
                - italic
                - underline
                - anchor
              style: sans
              spellcheck: true
              allow_source: true
              allow_internal_links: true
              semantic_elements: false
              restrict_assets: false
              display: Teaser
              instructions: 'Kurztext in der Blog-Übersicht'
              localizable: true
          -
            import: main_content
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  'SEO Meta':
    display: 'SEO Meta'
    sections:
      -
        fields:
          -
            handle: seo
            field:
              type: seo_pro
              listable: false
              display: SEO
              localizable: false
  'SEO Previews':
    display: 'SEO Previews'
    sections:
      -
        fields:
          -
            handle: seo_previews
            field:
              type: seo_pro_previews
              listable: false
              display: 'SEO Previews'
              localizable: false
              hide_display: true
              if: 'custom showSeoProPreviews'
