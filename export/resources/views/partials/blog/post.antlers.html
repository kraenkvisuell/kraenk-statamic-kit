{{# Blog teaser, linking to the post page (/blog/{slug}): title, teaser (Bard), read-more link. `post` is a CSS hook (h4 bar in editor-content.css). #}}
<div x-fade class="post editor-content mb-12.5">
    <div class="grow-0 max-w-[900px] px-5 md:px-10 xl:px-17.5">
        <h4>{{ title }}</h4>
        {{ teaser }}
        <p>
            <a href="{{ url }}">&gt; {{ trans:frontend.learn_more }}</a>
        </p>
    </div>
</div>
