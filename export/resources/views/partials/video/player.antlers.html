{{ _ratio = ratio ?? "16:9" }}
{{ if still }}
    {{ _still = {glide :src="still" width="1600"} }}
{{ else }}
    {{ _still = "/placeholders/image01.jpg" }}
{{ /if }}
<div
    x-data="videoConsent"
    class="relative w-full bg-ink bg-cover bg-center overflow-hidden [&_iframe]:absolute [&_iframe]:inset-0 [&_iframe]:w-full [&_iframe]:h-full [&_iframe]:border-0 {{ classes }}"
    style="aspect-ratio:{{ _ratio | replace(':', '/') }};background-image:url('{{ _still }}')"
>
    <template x-if="accepted">
        <div
            x-data="videoPlayer"
            data-key="{{ key }}"
            {{ if autoplay }}data-autoplay{{ /if }}
            class="absolute inset-0"
        >
            {{ partial:loading }}
            <div x-ref="player" class="absolute inset-0"></div>
        </div>
    </template>

    <template x-if="! accepted">
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 p-5 text-center text-white md:gap-6 {{ if still }} bg-overlay {{ /if }}">
            <p class="max-w-[36rem] font-main italic text-[0.75rem] leading-[1.5] md:text-[0.95rem]">{{ site_settings:video_consent_text | nl2br }}</p>
            <button
                type="button"
                @click="accept()"
                class="inline-block border border-white px-4 py-2.5 font-headline font-bold uppercase tracking-wider text-[0.7rem] leading-none cursor-pointer transition-colors hover:bg-paper hover:text-ink md:px-6 md:py-3 md:text-[0.8rem]"
            >{{ site_settings:video_consent_button }}</button>
            {{ if site_settings:privacy_page }}
                <a
                    href="{{ site_settings:privacy_page:url }}"
                    class="font-main italic text-off text-[0.7rem] underline hover:text-white md:text-[0.8rem]"
                >{{ trans:frontend.privacy }}</a>
            {{ /if }}
        </div>
    </template>
</div>
