taxonomies: false
title: Downloads
fields:
  -
    handle: downloads
    field:
      type: replicator
      sets:
        downloads:
          display: Downloads
          fields:
            -
              handle: file
              field:
                type: assets
                container: main
                folder: /
                restrict: false
                max_files: 1
                width: 50
                display: Datei
            -
              handle: title
              field:
                type: text
                instructions: 'Optional - wenn leer wird der Dateiname angezeigt'
                width: 50
                display: Titel
            -
              handle: show_filesize
              field:
                type: toggle
                width: 50
                default: true
                display: 'Dateigröße anzeigen'
      display: Downloads
      localizable: true
