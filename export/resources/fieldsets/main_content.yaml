title: Hauptinhalt
fields:
  -
    handle: main_content
    field:
      type: replicator
      display: Inhaltsblöcke
      localizable: true
      collapse: accordion
      sets:
        neue_setgruppe:
          display: 'Neue Setgruppe'
          sets:
            projects:
              display: Projekte
              icon: fieldtype-video
              fields:
                -
                  import: set_navigation
                -
                  handle: topline
                  field:
                    type: text
                    display: Topline
                    instructions: 'Optional – kleine Zeile über der Überschrift.'
                    width: 50
                    localizable: false
                -
                  handle: headline
                  field:
                    type: text
                    display: Überschrift
                    validate:
                      - required
                    width: 50
                    localizable: false
                -
                  handle: copy
                  field:
                    type: bard
                    display: 'Text (optional)'
                    buttons:
                      - bold
                      - italic
                      - anchor
                    style: sans
                    spellcheck: true
                    allow_source: false
                    allow_internal_links: true
                    semantic_elements: false
                    restrict_assets: false
                    localizable: false
            text_media:
              display: Text/Medien
              icon: fieldtype-textarea
              fields:
                -
                  import: set_navigation
                -
                  import: text_media
            blog:
              display: Blog
              icon: fieldtype-textarea
              fields:
                -
                  import: set_navigation
                -
                  handle: topline
                  field:
                    type: text
                    display: Topline
                    instructions: 'Optional – kleine Zeile über der Überschrift.'
                    width: 50
                    localizable: false
                -
                  handle: headline
                  field:
                    type: text
                    display: Überschrift
                    validate:
                      - required
                    width: 50
                    localizable: false
                -
                  handle: copy
                  field:
                    type: bard
                    display: 'Text (optional)'
                    buttons:
                      - bold
                      - italic
                      - anchor
                    style: sans
                    spellcheck: true
                    allow_source: false
                    allow_internal_links: true
                    semantic_elements: false
                    restrict_assets: false
                    localizable: false
            faq:
              display: 'Fragen & Antworten'
              icon: fieldtype-toggle
              fields:
                -
                  import: set_navigation
                -
                  handle: title
                  field:
                    type: text
                    display: Titel
                    validate:
                      - required
                    localizable: false
                -
                  handle: intro
                  field:
                    type: bard
                    display: Einleitung
                    buttons:
                      - bold
                      - italic
                      - anchor
                    style: sans
                    spellcheck: true
                    allow_source: false
                    allow_internal_links: true
                    semantic_elements: false
                    restrict_assets: false
                    localizable: false
                -
                  handle: questions
                  field:
                    type: replicator
                    display: Fragen
                    collapse: accordion
                    localizable: false
                    sets:
                      question:
                        display: Frage
                        icon: fieldtype-toggle
                        fields:
                          -
                            handle: question
                            field:
                              type: text
                              display: Frage
                              validate:
                                - required
                          -
                            handle: answer
                            field:
                              type: bard
                              display: Antwort
                              buttons:
                                - bold
                                - italic
                                - anchor
                                - unorderedlist
                                - orderedlist
                              style: sans
                              spellcheck: true
                              allow_source: false
                              allow_internal_links: true
                              link_noopener: false
                              link_noreferrer: false
                              target_blank: false
                              semantic_elements: false
                              restrict_assets: false
                              sets: {}
            embed_video:
              display: 'Embed-Video'
              fields:
                -
                  import: set_navigation
                -
                  import: embed_video
            gallery:
              display: Bildergalerie
              icon: media-image-picture-gallery
              fields:
                -
                  import: set_navigation
                -
                  handle: title
                  field:
                    type: text
                    display: Titel
                    validate:
                      - required
                    localizable: false
                -
                  handle: intro
                  field:
                    type: bard
                    display: Einleitung
                    buttons:
                      - bold
                      - italic
                      - anchor
                    style: sans
                    spellcheck: true
                    allow_source: false
                    allow_internal_links: true
                    semantic_elements: false
                    restrict_assets: false
                    localizable: false
                -
                  handle: images
                  field:
                    type: assets
                    display: Bilder
                    container: main
                    folder: /
                    mode: grid
                    instructions: 'Reihenfolge per Drag & Drop, Bildausschnitt über den Fokuspunkt des Assets.'
                    localizable: false
