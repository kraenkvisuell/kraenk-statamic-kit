<div class="editor-content max-w-[1024px] px-5 pt-12.5 pb-0 md:px-10 xl:px-17.5 {{ if less_top_padding }} pt-5 {{ /if }}">
    {{ if topline }}
        <p class="mb-[0.5em]">{{ topline }}</p>
    {{ /if }}
    {{ if headline }}
        <h2 class="text-[2rem] xl:text-[2.5rem] tracking-widest">{{ headline }}</h2>
    {{ /if }}
    {{ slot }}
</div>
