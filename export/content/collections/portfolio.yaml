title: Work
route: '/portfolio/{slug}'
template: film
sites:
  - default
  - en
taxonomies:
  - cameras
  - categories
  - clients
  - directors
  - productions
structure:
  max_depth: 1
inject:
  seo:
    description: '@seo:description'
    image: '@seo:still'
    og_type: video.other
  columns:
    - title
    - client.title
    - category.title
    - year
