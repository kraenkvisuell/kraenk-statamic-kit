{{ if {collection:count in="blog"} > 0 }}
    <div
        class="section mb-7.5 md:mb-17.5"
        id="{{ partial:sets/anchor }}"
    >
        {{ partial:section/heading :topline="set:topline" :headline="set:headline" }}
            {{ set:copy }}
        {{ /partial:section/heading }}

        <div>
            {{ collection:blog show_future="true" }}
                {{ partial:blog/post }}
            {{ /collection:blog }}
        </div>
    </div>
{{ /if }}
