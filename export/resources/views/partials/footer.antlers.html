{{ partial:partners }}
<div class="section is-footer bg-footer text-footer-text">
    <div class="w-full px-5 pt-12.5 md:px-10 xl:px-17.5">
        <div x-data="videoConsent" x-show="accepted" x-cloak class="[&[x-cloak]]:hidden mb-7.5">
            <button
                type="button"
                @click="revoke()"
                class="inline-block border border-footer-text px-4 py-2.5 font-headline font-bold uppercase tracking-wider text-[0.7rem] leading-none cursor-pointer transition-colors hover:bg-footer-text hover:text-footer"
            >{{ site_settings:video_consent_revoke }}</button>
        </div>
    </div>

    <div class="flex flex-col gap-5 px-5 pb-12.5 md:flex-row md:items-end md:justify-between md:px-10 xl:px-17.5 font-headline font-bold uppercase tracking-wider text-[0.7rem] leading-none">
        {{ partial:footer/navi }}
        <p>&copy; {{ config:app:name }} {{ now | format('Y') }}</p>
    </div>
</div>
