title: Seiten
icon: collections
sites:
  - default
  - en
propagate: false
template: default
layout: layout
revisions: false
route:
  default: '{{ is_root ? "" : "/de" }}/{{ slug }}'
  en: '/{{ slug }}'
sort_dir: asc
date_behavior:
  past: null
  future: null
preview_targets:
  -
    label: Entry
    url: '{permalink}'
    refresh: true
structure:
  root: true
